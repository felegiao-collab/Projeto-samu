name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Preparar arquivos
        run: |
          # aceita main.dart na raiz (envio pelo celular) ou em lib/
          if [ -f main.dart ] && [ -f lib/main.dart ] && ! cmp -s main.dart lib/main.dart; then
            echo "::error::Existem DOIS main.dart diferentes (um na raiz e outro em lib/). Apague um deles e deixe só o mais novo."
            exit 1
          fi
          if [ -f main.dart ]; then mkdir -p lib && mv main.dart lib/main.dart; fi
          test -f lib/main.dart && test -f pubspec.yaml
          cp pubspec.yaml /tmp/pubspec.bak
          cp lib/main.dart /tmp/main.bak
          flutter create --platforms=android --project-name controle_plantao --org br.com.plantao .
          cp /tmp/pubspec.bak pubspec.yaml
          cp /tmp/main.bak lib/main.dart
      - name: Manifesto Android
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <application
                  android:label="Controle de Plantão"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <!-- Necessários para as notificações agendadas dispararem e sobreviverem a reinício do aparelho -->
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
                  <meta-data android:name="flutterEmbedding" android:value="2"/>
              </application>
          </manifest>
          XML
      - name: Gradle (desugaring)
        run: |
          python3 - <<'PY'
          import os, re, sys
          kts, groovy = "android/app/build.gradle.kts", "android/app/build.gradle"
          path = kts if os.path.exists(kts) else groovy
          is_kts = path == kts
          s = open(path, encoding="utf-8").read()
          flag = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
          if re.search(r"compileOptions\s*\{", s):
              s = re.sub(r"(compileOptions\s*\{)", r"\1\n        " + flag, s, count=1)
          else:
              s = re.sub(r"(android\s*\{)", r"\1\n    compileOptions {\n        " + flag + "\n    }", s, count=1)
          mini = ("isMinifyEnabled = false\n            isShrinkResources = false" if is_kts else "minifyEnabled false\n            shrinkResources false")
          if re.search(r"release\s*\{", s):
              s = re.sub(r"(release\s*\{)", lambda m: m.group(1) + "\n            " + mini, s, count=1)
          lib = "com.android.tools:desugar_jdk_libs:2.1.4"
          s += ('\ndependencies {\n    coreLibraryDesugaring("%s")\n}\n' if is_kts else "\ndependencies {\n    coreLibraryDesugaring '%s'\n}\n") % lib
          open(path, "w", encoding="utf-8").write(s)
          print("patched", path)
          PY
      - run: flutter pub get
      - name: Compilar APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: controle-plantao-apk
          path: build/app/outputs/flutter-apk/app-release.apk
